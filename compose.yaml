# Local Postgres for development and tests. It listens on localhost only, and on port 5433
# so it doesn't clash with a Postgres already installed on the host.
name: wolfchatter

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wolfchatter
      POSTGRES_PASSWORD: wolfchatter
      POSTGRES_DB: wolfchatter
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wolfchatter -d wolfchatter']
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
