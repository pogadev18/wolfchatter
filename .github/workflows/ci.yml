name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test, work log
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same image, credentials and host port as compose.yaml, so the tests' default
      # DATABASE_URL from apps/api/.env.example works unchanged.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wolfchatter
          POSTGRES_PASSWORD: wolfchatter
          POSTGRES_DB: wolfchatter
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wolfchatter -d wolfchatter"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Work log
        run: pnpm worklog:check
